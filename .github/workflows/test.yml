name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Kept separate from the tests: a style nit should never hide a test result.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-dev.txt pins ruff's version and pyproject.toml pins its
      # rule set, because ruff changes its default selection between releases.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # The Python suite cannot open a browser, and every frontend bug this pack has
  # shipped went out through a green Python suite. This drives the real,
  # unmodified web/*.js against a fake LiteGraph node.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --import ./tests/frontend/hooks.mjs --test "tests/frontend/*.test.mjs"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ComfyUI supplies torch at runtime; the CPU wheel is enough to test with.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q
