[project]
name = "ReLight"
description = "Relight images without re-generating them: up to 3 positionable light sources, colored or corrective light, presets, rim lighting, and mask-aware 3D occlusion - fast, deterministic, no models to download."
version = "3.0.0"
license = {file = "LICENSE"}
dependencies = ["numpy", "Pillow", "scipy"]

[project.urls]
Repository = "https://github.com/EnragedAntelope/comfyui-relight"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "enragedantelope"
DisplayName = "ComfyUI-ReLight"
Icon = ""
# The node is built on the ComfyUI v3 schema (comfy_api), which first shipped in
# ComfyUI 0.3.48. On older builds the import fails and the node never appears.
requires-comfyui = ">=0.3.48"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
exclude = ["tests/stubs"]

[tool.ruff.lint]
ignore = ["E741"]
